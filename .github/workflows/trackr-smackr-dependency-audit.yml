name: lab.coattrain.coat Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * 1"

permissions:
  contents: read

jobs:
  audit-lab-coattrain-coat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install extension dependencies
        run: npm ci

      - name: Run dependency audit report
        run: npm run audit:deps
        env:
          AUDIT_FAIL_ON: critical

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lab-coattrain-coat-dependency-audit
          path: |
            audit-reports/npm-audit.json
            audit-reports/npm-outdated.json
            audit-reports/dependency-audit-summary.md
          if-no-files-found: warn
