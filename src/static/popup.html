<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TrackRSmackR</title>
    <style>
      body {
        width: 340px;
        font-family: sans-serif;
        padding: 10px;
      }

      h1 {
        font-size: 16px;
        color: #d9534f;
      }

      .section-title {
        margin: 12px 0 6px;
        font-size: 13px;
        font-weight: 700;
      }

      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }

      select,
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        font-size: 12px;
      }

      textarea {
        min-height: 64px;
        resize: vertical;
      }

      button {
        margin-top: 8px;
        padding: 6px 8px;
        border: 1px solid #c9302c;
        background: #d9534f;
        color: white;
        cursor: pointer;
      }

      #settings-status {
        margin-top: 6px;
        font-size: 11px;
        color: #666;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .summary-card {
        border: 1px solid #e7e7e7;
        border-radius: 6px;
        padding: 6px;
        background: #fafafa;
      }

      .summary-label {
        display: block;
        font-size: 10px;
        color: #666;
        margin-bottom: 2px;
      }

      .summary-value {
        display: block;
        font-size: 12px;
        font-weight: 700;
      }

      .summary-detail {
        margin-top: 6px;
        font-size: 11px;
      }

      .summary-list {
        margin: 4px 0 0;
        padding-left: 16px;
      }

      .summary-list li {
        margin-bottom: 2px;
      }

      .log-entry {
        font-size: 12px;
        border-bottom: 1px solid #eee;
        padding: 6px 0;
      }

      .log-title {
        font-weight: 700;
      }

      .log-reason {
        color: #444;
        margin-top: 2px;
      }

      .log-signals {
        color: #666;
        font-size: 11px;
        margin-top: 2px;
      }

      .log-meta {
        color: #666;
        font-size: 11px;
        margin-top: 2px;
      }

      .log-actions {
        margin-top: 4px;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }

      .trust-button {
        font-size: 11px;
        padding: 3px 8px;
        background: #fff;
        color: #1e6fc8;
        border: 1px solid #1e6fc8;
        border-radius: 3px;
        cursor: pointer;
        margin: 0;
        width: auto;
      }

      .trust-button:hover {
        background: #1e6fc8;
        color: #fff;
      }

      .trust-always {
        font-size: 11px;
        padding: 3px 8px;
        background: #fff;
        color: #b8860b;
        border: 1px solid #d4a017;
        border-radius: 3px;
        cursor: pointer;
        margin: 0;
        width: auto;
      }

      .trust-always:hover {
        background: #d4a017;
        color: #fff;
      }

      .trust-status {
        font-size: 11px;
        color: #22863a;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>TrackRSmackR Active</h1>

    <div class="section-title">Policy Settings</div>
    <label for="policy-mode">Policy Mode</label>
    <select id="policy-mode">
      <option value="BALANCED">Balanced (Decay unknown cookies)</option>
      <option value="STRICT">Strict (Quarantine unknown cookies)</option>
    </select>
    <label for="allowlist-input">Allowlist Domains</label>
    <textarea
      id="allowlist-input"
      placeholder="example.com&#10;accounts.google.com"
    ></textarea>
    <button id="save-settings" type="button">Save Settings</button>
    <div id="settings-status"></div>

    <div class="section-title">Intelligence Snapshot</div>
    <div class="summary-grid">
      <div class="summary-card">
        <span class="summary-label">Threat Posture</span>
        <span id="summary-posture" class="summary-value">-</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Fingerprint Signals</span>
        <span id="summary-fingerprint" class="summary-value">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Adaptive Drift</span>
        <span id="summary-drift-count" class="summary-value">0</span>
      </div>
      <div class="summary-card">
        <span class="summary-label">Session Approved</span>
        <span id="summary-session-approved" class="summary-value">0</span>
      </div>
    </div>
    <div class="summary-detail">
      <strong>Drift Alerts</strong>
      <ul id="summary-drift-list" class="summary-list">
        <li>No significant drift detected yet.</li>
      </ul>
    </div>

    <div class="section-title">Recent Activity</div>
    <div id="logs">Loading...</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
